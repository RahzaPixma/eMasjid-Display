name: ChatGPT Code Review
on: [pull_request]

jobs:
  review:
    runs-on: ubuntu-latest
    # Explicitly grant write access to the GITHUB_TOKEN
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: ChatGPT Review
        uses: cirolini/genai-code-review@v2 # Example action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
